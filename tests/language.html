<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Language regression checks</title></head>
<body><h1>Language regression checks</h1><pre id="results">Running...</pre><iframe title="Website under test" style="width:100%;height:850px;border:0"></iframe>
<script>
(async () => {
  const results = [], frame = document.querySelector('iframe');
  const options = new URLSearchParams(location.search);
  const width = options.get('width');
  if (width) frame.style.width = `${Number(width)}px`;
  const check = (name, value, detail = '') => {
    results.push(`${value ? 'PASS' : 'FAIL'}: ${name}${!value && detail ? '\n' + detail : ''}`);
    document.querySelector('#results').textContent = results.join('\n');
  };
  const tick = () => new Promise(resolve => setTimeout(resolve, 120));
  async function load(path) {
    await new Promise(resolve => { frame.onload = resolve; frame.src = `../${path}`; });
    await tick();
    return frame.contentDocument;
  }
  if (options.has('preview')) {
    await load(`${options.get('preview') || 'index.html'}?lang=${options.get('lang') === 'en' ? 'en' : 'zh'}`);
    document.querySelector('h1').hidden = true;
    document.querySelector('#results').hidden = true;
    document.body.style.margin = '0';
    frame.style.display = 'block';
    frame.style.height = '1600px';
    return;
  }
  const normalise = value => value.replace(/\s+/g, ' ').trim();
  const names = new Set(['P3H', 'Humanistic Hands and Heart', 'Healthy-Tec', 'Mindfull Community', 'La Kopi Kakis', 'FITWISE', 'ECON Healthcare', 'The Life Review', 'All My Days', 'HCG', 'CTG', 'SMF', 'HPC+', 'MET', 'EASE', 'MOW', 'Caregiver 24.7', 'caregiversupport@tzuchi.org.sg']);
  let doc = await load('index.html?lang=en');
  frame.contentWindow.localStorage.removeItem('p3h-language');
  doc = await load('index.html');
  check('First visit defaults to English', doc.documentElement.lang === 'en-SG' && doc.querySelector('h1').textContent.includes('You care for others.'));
  for (const page of ['index.html', 'assistance.html', 'activities.html', 'resources.html', 'contact.html', 'caregiving-journey.html']) {
    doc = await load(`${page}?lang=en`);
    const texts = [], attrs = [];
    const walker = doc.createTreeWalker(doc.body, frame.contentWindow.NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const node = walker.currentNode;
      if (node.parentElement.closest('script, style, noscript, [data-language], [data-language-button], [data-i18n-dynamic]')) continue;
      if (/[a-zA-Z]{2}/.test(node.nodeValue)) texts.push([node, node.nodeValue]);
    }
    for (const element of doc.querySelectorAll('[alt], [aria-label], [aria-roledescription], meta[name="description"]')) {
      if (element.closest('[data-language], [data-language-button]')) continue;
      for (const name of ['alt', 'aria-label', 'aria-roledescription', 'content']) {
        const original = element.getAttribute(name);
        if (original && /[a-zA-Z]{2}/.test(original)) attrs.push([element, name, original]);
      }
    }
    const englishTitle = doc.title;
    const switchButton = doc.querySelector('[data-language-button="zh"]');
    switchButton.focus(); switchButton.click();
    const untranslated = texts.filter(([node, original]) => node.isConnected && node.nodeValue === original && !names.has(normalise(original))).map(([, original]) => normalise(original));
    const untranslatedAttrs = attrs.filter(([element, name, original]) => element.isConnected && element.getAttribute(name) === original && !names.has(original)).map(([, name, original]) => `${name}: ${original}`);
    check(`${page}: complete Chinese text coverage`, untranslated.length === 0, [...new Set(untranslated)].join('\n'));
    check(`${page}: translated accessible labels and metadata`, untranslatedAttrs.length === 0, [...new Set(untranslatedAttrs)].join('\n'));
    check(`${page}: one shared language switch`, doc.querySelectorAll('[data-language-button]').length === 2);
    check(`${page}: Chinese language and title`, doc.documentElement.lang === 'zh-Hans-SG' && doc.title !== englishTitle);
    check(`${page}: active button and keyboard focus`, switchButton.getAttribute('aria-pressed') === 'true' && doc.activeElement === switchButton);
    const internalLinks = [...doc.querySelectorAll('a[href]')].filter(link => link.origin === frame.contentWindow.location.origin && link.pathname.endsWith('.html') && !link.getAttribute('href').startsWith('#'));
    check(`${page}: internal links carry Chinese`, internalLinks.every(link => new URL(link.href).searchParams.get('lang') === 'zh'));
    check(`${page}: Chinese fits viewport`, doc.documentElement.scrollWidth <= frame.contentWindow.innerWidth + 1);
    if (page === 'activities.html') {
      const slideshow = doc.querySelector('.activity-slideshow.is-ready');
      if (slideshow) {
        const total = slideshow.querySelectorAll('.activity-slide').length;
        const headingId = slideshow.closest('.activity-card').getAttribute('aria-labelledby');
        slideshow.querySelector('[data-direction="1"]').click();
        check('Slideshow counter stays Chinese after clicking', slideshow.querySelector('.activity-counter').textContent === `第2张，共${total}张`);
        doc.querySelector('[data-language-button="en"]').click();
        const updatedCard = doc.getElementById(headingId).closest('.activity-card');
        check('Slideshow keeps selected photo on language switch', updatedCard.querySelector('.activity-counter').textContent === `Photo 2 of ${total}`);
      }
    }
    doc.querySelector('[data-language-button="en"]').click();
    check(`${page}: English source restored exactly`, texts.every(([node, original]) => node.nodeValue === original) && attrs.every(([element, name, original]) => element.getAttribute(name) === original) && doc.title === englishTitle);
  }
  doc.querySelector('[data-language-button="zh"]').click();
  doc = await load('contact.html');
  check('Chinese preference persists between pages', doc.documentElement.lang === 'zh-Hans-SG');
  doc = await load('resources.html?lang=en');
  check('Explicit English link overrides saved Chinese', doc.documentElement.lang === 'en-SG');
  doc = await load('streams/stream-3.html?lang=zh');
  check('Compatibility route translates and retains support section', doc.documentElement.lang === 'zh-Hans-SG' && !doc.querySelector('#support-options').hidden && doc.querySelector('#support-3').open);
  check('Nested route loads translation assets', !!frame.contentWindow.P3HChinese && doc.querySelector('h1').textContent === '看护者支持');
  frame.contentWindow.localStorage.removeItem('p3h-language');
  document.querySelector('#results').textContent = results.join('\n') + `\n\n${results.filter(result => result.startsWith('PASS')).length}/${results.length} passed`;
  document.title = results.some(result => result.startsWith('FAIL')) ? 'FAIL: P3H languages' : 'PASS: P3H languages';
})().catch(error => { document.querySelector('#results').textContent = 'FAIL: ' + error.stack; document.title = 'FAIL: P3H languages'; });
</script></body></html>
